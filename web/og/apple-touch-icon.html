<!doctype html>
<!-- The iOS home-screen icon, 180 × 180, rendered to public/apple-touch-icon.png by `pnpm og`. iOS rounds the
     corners itself, so the app icon sits on a full square of its own cream. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; background: #fbf3e3; }
      img { display: block; width: 180px; height: 180px; }
    </style>
  </head>
  <body><img src="../public/brand/valet-app-icon.svg" alt="" /></body>
</html>
