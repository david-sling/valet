name: Build Windows app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'packages/protocol/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile

      # Unsigned: no Authenticode signature, and no updater artifacts, which need the update signing key
      - name: Build the installer
        working-directory: app
        shell: bash
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: Valet-windows-unsigned
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Run the Rust tests
        working-directory: app/src-tauri
        run: cargo test
