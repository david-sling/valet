name: Release app

on:
  push:
    tags: ['app-v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the release notes
        run: |
          git fetch --quiet --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN .*SIGNATURE-----$/,$d')
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] && printf '%s' "$notes" | grep -q '[^[:space:]]' || {
            echo "::error::Put the release notes in the tag message: git tag -a $GITHUB_REF_NAME --cleanup=whitespace -F notes.md"; exit 1; }

      - name: Check the tag matches the app version
        id: version
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          [ "$GITHUB_REF_NAME" = "app-v$version" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Each platform keeps its finished files in the Actions cache under the tag and commit,
  # so pushing the same tag again rebuilds only the platform that has none.
  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for this commit's build
        id: built
        uses: actions/cache/restore@v4
        with:
          path: dist/macos
          key: release-macos-${{ github.ref_name }}-${{ github.sha }}
          lookup-only: true
          enableCrossOsArchive: true

      - if: steps.built.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.built.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.built.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - if: steps.built.outputs.cache-hit != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - if: steps.built.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Write the App Store Connect key
        if: steps.built.outputs.cache-hit != 'true'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - if: steps.built.outputs.cache-hit != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: --target universal-apple-darwin

      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Collect the release files
        if: steps.built.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          bundle=app/src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p dist/macos
          cp "$bundle/dmg/Valet_${VERSION}_universal.dmg" dist/macos/
          cp "$bundle/dmg/Valet_${VERSION}_universal.dmg" dist/macos/Valet.dmg
          cp "$bundle/macos/Valet.app.tar.gz" dist/macos/Valet_universal.app.tar.gz
          cp "$bundle/macos/Valet.app.tar.gz.sig" dist/macos/Valet_universal.app.tar.gz.sig

      - if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/macos
          key: release-macos-${{ github.ref_name }}-${{ github.sha }}
          enableCrossOsArchive: true

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for this commit's build
        id: built
        uses: actions/cache/restore@v4
        with:
          path: dist/windows
          key: release-windows-${{ github.ref_name }}-${{ github.sha }}
          lookup-only: true
          enableCrossOsArchive: true

      - if: steps.built.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.built.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.built.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.built.outputs.cache-hit != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - if: steps.built.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # No Authenticode signature yet, so SmartScreen warns on first install; the update is still signed with the updater key
      - name: Build the installer
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Collect the release files
        if: steps.built.outputs.cache-hit != 'true'
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          setup="app/src-tauri/target/release/bundle/nsis/Valet_${VERSION}_x64-setup.exe"
          mkdir -p dist/windows
          cp "$setup" "$setup.sig" dist/windows/
          cp "$setup" dist/windows/Valet-setup.exe

      - if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/windows
          key: release-windows-${{ github.ref_name }}-${{ github.sha }}
          enableCrossOsArchive: true

  # Runs only when both platforms have their files, so the draft always carries both
  release:
    needs: [check, macos, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: dist/macos
          key: release-macos-${{ github.ref_name }}-${{ github.sha }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true

      - uses: actions/cache/restore@v4
        with:
          path: dist/windows
          key: release-windows-${{ github.ref_name }}-${{ github.sha }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true

      - name: Write the release notes
        run: |
          git fetch --quiet --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN .*SIGNATURE-----$/,$d' > "$RUNNER_TEMP/notes.md"
          printf '\n%s\n' 'Signed and notarised for macOS 13 or later, on Apple silicon and Intel. The Windows installer is for Windows 10 and 11 (x64) and is not code-signed yet, so Windows may warn before it runs.' >> "$RUNNER_TEMP/notes.md"

      - name: Write the update feed
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          setup="Valet_${VERSION}_x64-setup.exe"
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes "$RUNNER_TEMP/notes.md" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --arg mac_url "$base/Valet_universal.app.tar.gz" \
            --rawfile mac_sig dist/macos/Valet_universal.app.tar.gz.sig \
            --arg win_url "$base/$setup" \
            --rawfile win_sig "dist/windows/$setup.sig" \
            '{version: $version, notes: ($notes | rtrimstr("\n")), pub_date: $date, platforms: {
                "darwin-aarch64": {signature: $mac_sig, url: $mac_url},
                "darwin-x86_64": {signature: $mac_sig, url: $mac_url},
                "darwin-aarch64-app": {signature: $mac_sig, url: $mac_url},
                "darwin-x86_64-app": {signature: $mac_sig, url: $mac_url},
                "windows-x86_64": {signature: $win_sig, url: $win_url},
                "windows-x86_64-nsis": {signature: $win_sig, url: $win_url}}}' > dist/latest.json
          jq '.platforms | keys' dist/latest.json

      - name: Create the draft release
        run: |
          existing=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null || true)
          if [ "$existing" = false ]; then
            echo "::error::$GITHUB_REF_NAME is already published; bump the version for a new release"; exit 1
          elif [ "$existing" = true ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Valet $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/macos/* dist/windows/* dist/latest.json
